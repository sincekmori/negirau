[project]
name = "negirau"
version = "0.3.1"
description = "Python client for the Negirau public API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# All non-EOL CPython minors (house rule); 3.10 is the current floor.
requires-python = ">=3.10"
authors = [{ name = "Shinsuke Mori", email = "sincekmori@gmail.com" }]
keywords = ["negirau", "api", "client", "appreciation", "gratitude"]
# No License classifier: the SPDX `license` expression (PEP 639) supersedes it.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  # typing.Self exists only from 3.11; the floor is 3.10 (also a pydantic transitive).
  "typing-extensions>=4.6",
]

[project.urls]
Homepage = "https://negirau.com"
Repository = "https://github.com/sincekmori/negirau"
Issues = "https://github.com/sincekmori/negirau/issues"

[dependency-groups]
dev = [
  # jsonschema powers the contract tests: sample payloads are proven
  # spec-conformant before the client is required to parse them.
  "jsonschema>=4.23",
  "pytest>=8",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff",
  "ty",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
# The floor of the supported range, matching requires-python.
target-version = "py310"

[tool.ruff.lint]
# House philosophy: enable everything; each ignore carries its reason.
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the ruff formatter (trailing-comma ownership)
  "D203", # conflicting docstring pair: D211 (no blank line before class docstring) wins
  "D213", # conflicting docstring pair: D212 (summary on the first line) wins
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
# Deliberately stricter than the default 10 (house threshold).
max-complexity = 5

[tool.ruff.lint.flake8-copyright]
# SPDX headers are the house copyright notice.
notice-rgx = "SPDX-License-Identifier:"

[tool.ruff.lint.pylint]
# list_subjects mirrors the spec's six query parameters as keyword-only args.
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # pytest asserts ARE the test mechanism
  "PLR2004", # tests assert on literal values by design
  "D", # test names document themselves; docstrings would repeat them
  "ANN", # fixture/parametrize types add noise, not safety, in tests
  "SLF001", # asserting on the private _http client is the point of the default-construction tests
  "EM101", # mock transport handlers raise canned errors with literal messages
]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ty.environment]
# Type-check against the floor so oldest-version breakage surfaces first.
python-version = "3.10"

[tool.pytest.ini_options]
# Coverage always on; private repo, so it stays in the terminal/CI log (no upload).
# --cov-branch matches the TS side's branches:100 threshold.
addopts = "--cov=negirau --cov-branch --cov-report=term-missing --cov-fail-under=100"
asyncio_mode = "auto"
