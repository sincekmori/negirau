# Weekly dependency PRs for every ecosystem in the repo, one grouped PR each.
# The 7-day cooldown mirrors the install-time minimumReleaseAge in bunfig.toml
# and in both packages/*/pnpm-workspace.yaml — change one, change all three.
# Prefixes are the commit types release-please hides (build, ci), so a bump
# never releases on its own; it ships with the next feat/fix (AGENTS.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
        # oxfmt formats the generated SKILL.md and zod emits the spec's JSON
        # Schema, so either bump can move the committed skills/negirau snapshot,
        # which Dependabot cannot regenerate (check:drift). Kept out of the group
        # so the weekly PR stays green; run `bun run generate:skill` on theirs.
        exclude-patterns: ["oxfmt", "zod"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "npm" # packages/client-ts uses pnpm (published npm package)
    directory: "/packages/client-ts"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "npm" # packages/mcp-server uses pnpm (published npm package)
    directory: "/packages/mcp-server"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "uv" # packages/client-py
    directory: "/packages/client-py"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    # A published library: never rewrite pyproject's lower bounds, only move
    # uv.lock. GitHub rejects "widen" for uv (allowed: lockfile-only, auto,
    # increase, increase-if-necessary); transitive pins only move when a direct
    # dependency does (dependabot/dependabot-core#14073).
    versioning-strategy: "lockfile-only"
    commit-message:
      prefix: "build"
      include: "scope"
